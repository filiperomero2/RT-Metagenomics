appId: com.electron.app
productName: RT-Metagenomics
afterPack: scripts/after-pack.cjs
directories:
  buildResources: src/renderer/public
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
extraResources:
  - from: "resources/back/app"
    to: "back/app"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!*.pyc"
      - "!rtmeta.db"
asarUnpack:
  - "resources/**"
win:
  executableName: RT-Metagenomics
  icon: logo.ico
  signAndEditExecutable: false
  target:
    - nsis
    - portable
  extraResources:
    - from: "resources/conda-env-linux.tar.gz"
      to: "conda-env-linux.tar.gz"
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: src/renderer/public/logo.ico
  uninstallerIcon: src/renderer/public/logo.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
linux:
  icon: logo.png
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Science
  extraResources:
    - from: "resources/conda-env.tar.gz"
      to: "conda-env.tar.gz"
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates

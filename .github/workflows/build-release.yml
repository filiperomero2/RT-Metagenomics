name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create release as draft"
        type: boolean
        default: true
      tag_name:
        description: "Release tag (e.g. v0.1.0). Defaults to v{package.json version}"
        type: string
        required: false

permissions:
  contents: write

env:
  CONDA_ENV_NAME: rt-meta
  PYTHON_VERSION: "3.11"
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  pack-conda-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: rt-meta
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge,bioconda

      - name: Build Linux conda environment
        shell: bash -el {0}
        run: |
          conda env update -n rt-meta --file back/app/viralunity/environment.yml
          conda env update -n rt-meta --file back/environment.yml
          conda install -n rt-meta conda-pack -y
          conda run -n rt-meta pip install "./back/app/viralunity"
          conda run -n rt-meta python -c "import uvicorn, fastapi, sqlmodel, pydantic, dotenv"
          mkdir -p front/resources
          conda run -n rt-meta conda-pack \
            -n rt-meta \
            -o front/resources/conda-env-linux.tar.gz \
            --ignore-editable-packages \
            --force
          ls -lh front/resources/conda-env-linux.tar.gz

      - name: Upload Linux conda pack
        uses: actions/upload-artifact@v4
        with:
          name: conda-env-linux
          path: front/resources/conda-env-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

  build:
    needs: pack-conda-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Linux conda pack
        uses: actions/download-artifact@v4
        with:
          name: conda-env-linux
          path: front/resources

      - name: Verify Linux conda pack
        shell: bash
        run: |
          ls -lhR front/resources/
          if [ ! -f front/resources/conda-env-linux.tar.gz ]; then
            found="$(find front/resources -name 'conda-env-linux.tar.gz' | head -1)"
            if [ -n "$found" ]; then
              cp "$found" front/resources/conda-env-linux.tar.gz
            fi
          fi
          test -f front/resources/conda-env-linux.tar.gz

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: front
        run: bun install --frozen-lockfile

      - name: Prepare Linux conda resource name
        if: matrix.platform == 'linux'
        shell: bash
        run: cp front/resources/conda-env-linux.tar.gz front/resources/conda-env.tar.gz

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        shell: bash -el {0}
        run: ./build.sh --linux --skip-conda

      - name: Build (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./build.ps1 -Platform win

      - name: List build artifacts
        shell: bash {0}
        run: ls -lh front/dist/ 2>/dev/null || ls front/dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            front/dist/*.AppImage
            front/dist/*.deb
            front/dist/*.exe
            front/dist/*.snap
          if-no-files-found: error
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./front/package.json').version")"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: RT-Metagenomics ${{ steps.release_tag.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          generate_release_notes: true
          files: artifacts/*

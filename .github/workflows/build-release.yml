name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create release as draft"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CONDA_ENV_NAME: rt-meta
  PYTHON_VERSION: "3.11"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder-flags: --linux
          - os: windows-latest
            platform: win
            builder-flags: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Conda ────────────────────────────────────────────────────────────
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: rt-meta
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge,bioconda

      - name: Install conda dependencies
        shell: bash -el {0}
        run: |
          conda env update -n rt-meta --file back/environment.yml --prune
          conda env update -n rt-meta --file back/app/viralunity/environment.yml --prune
          conda install -n rt-meta conda-pack -y

      - name: Pack conda environment
        shell: bash -el {0}
        run: |
          mkdir -p front/resources
          conda-pack \
            -n rt-meta \
            -o front/resources/conda-env.tar.gz \
            --ignore-editable-packages \
            --force
          echo "Packed size: $(du -sh front/resources/conda-env.tar.gz | cut -f1)"

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: front
        run: bun install --frozen-lockfile

      - name: Copy backend source into resources
        shell: bash {0}
        run: |
          rm -rf front/resources/back
          mkdir -p front/resources/back/app
          cp -r back/app/. front/resources/back/app/
          find front/resources/back -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find front/resources/back -name "*.pyc" -delete 2>/dev/null || true
          rm -f front/resources/back/app/rtmeta.db

      - name: Build Electron app (electron-vite)
        working-directory: front
        run: bun run prebuild

      # ── Package ──────────────────────────────────────────────────────────
      - name: Package with electron-builder
        working-directory: front
        run: bunx electron-builder ${{ matrix.builder-flags }} --publish never

      - name: List build artifacts
        shell: bash {0}
        run: ls -lh front/dist/ 2>/dev/null || dir front\\dist

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            front/dist/*.AppImage
            front/dist/*.deb
            front/dist/*.exe
            front/dist/*.snap
          if-no-files-found: error
          retention-days: 5

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft == '' && true || inputs.draft }}
          generate_release_notes: true
          files: artifacts/*
